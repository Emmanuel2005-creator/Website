{% extends 'auth_layout.html' %}
{% block title %}Welcome back{% endblock %}
{% block auth_form %}
<h2 id="form-title">Welcome back.</h2>
<p class="form-intro">Your thoughts are right where you left them.</p>
<form method="post" class="auth-form">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="field"><label for="email">Email address</label><input type="text" inputmode="email" id="email" name="email" autocomplete="email" placeholder="you@example.com" value="{{ request.form.get('email', '') }}" required></div>
  <div class="field"><label for="password">Password</label><input type="password" id="password" name="password" autocomplete="current-password" placeholder="Enter your password" required></div>
  <button class="button button-primary button-full" type="submit">Log in to your notebook {{ icon('arrow') }}</button>
</form>
<p class="form-switch">A fresh start? <a href="{{ url_for('auth.sign_up') }}">Create an account</a></p>
{% endblock %}

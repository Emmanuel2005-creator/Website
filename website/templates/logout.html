{% extends 'base.html' %}
{% block title %}Log out{% endblock %}
{% block content %}<section class="utility-card"><span class="small-icon">{{ icon('logout') }}</span><h1>Ready to step away?</h1><p>Your saved notes will be here when you return.</p><form action="{{ url_for('auth.logout') }}" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="button button-primary" type="submit">Log out</button> <a class="button button-secondary" href="{{ url_for('views.home') }}">Stay here</a></form></section>{% endblock %}
